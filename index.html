<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F5">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>โภชนาการแม่นยำ — BY IM</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#EFEFEF;
  --border:#E0E0E0;
  --primary:#2B2B2B; --primary-dark:#141414; --on-primary:#FFFFFF; --primary-text:#2A2A2A;
  --accent:#6E6E6E;
  --text:#1A1A1A; --text-2:#626262; --text-3:#6E6E6E;
  --warn:#B8860B; --danger:#C0392B;
  --bar-fat:#9A9A9A; --bar-fiber:#BDBDBD;
  --track:rgba(0,0,0,.08); --focus-ring:rgba(43,43,43,.15);
  --font-display:'Bai Jamjuree','Sarabun','Leelawadee UI','Thonburi','Noto Sans Thai',sans-serif;
  --font-body:'Chakra Petch','Sarabun','Leelawadee UI','Thonburi','Noto Sans Thai',sans-serif;
  --font-num:'Chakra Petch','Sarabun','Leelawadee UI','Thonburi','Noto Sans Thai',sans-serif;
  --r:14px; --r-btn:14px; --rsm:10px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --white:#FFFFFF; --shot-bg:#111111;
}
/* Thai has no spaces: let the browser's dictionary break between words (lang="th"), never mid-word */
*{margin:0;padding:0;box-sizing:border-box;overflow-wrap:break-word;word-break:normal;line-break:auto}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%;
  line-height:1.3;
  overflow:hidden;
}

/* ── LAYOUT ── */
.max-w{margin:0;padding:8px 10px 6px}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;margin-bottom:2px}
.hdr-title{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:0;line-height:1.25;white-space:nowrap}

/* ── SECTION LABEL ── */
.sl{
  font-family:var(--font-display);
  font-size:16px;font-weight:700;letter-spacing:.02em;
  color:var(--text-2);
  margin:8px 0 5px;
  padding-left:9px;border-left:3px solid var(--border);
  display:flex;align-items:center;min-height:24px;line-height:1.25;
}
.sl-blue{border-left-color:var(--primary);color:var(--primary-text)}
.sl-green{border-left-color:var(--accent);color:var(--primary-text)}

/* ── CARD BASE ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:0;overflow:hidden;
  margin-bottom:6px;box-shadow:var(--sh);
}

/* ── FORM GRID: body info + program settings in one card ── */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
.sf{background:var(--surface);padding:6px 9px 5px;min-width:0}
.sf.s2{grid-column:span 2}
.sf.s4{grid-column:span 4}
.sf.inl{display:flex;align-items:center;gap:8px;padding:4px 9px}
.sf.inl label{flex:0 0 auto;margin:0;font-size:14px;overflow:visible}
.sf.inl select{flex:1 1 auto;font-size:16.5px;text-align:right;text-align-last:right;padding-right:16px}
.sf:focus-within{box-shadow:inset 0 0 0 2px var(--primary);position:relative}
.sf.readonly-field{opacity:.65}
.sf.readonly-field input[type=date]{pointer-events:none}
.sf label{
  font-size:13.5px;font-weight:600;letter-spacing:0;color:var(--text-3);
  display:block;margin-bottom:2px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:clip;
}
.fld{display:flex;align-items:baseline;gap:3px;min-width:0}
.fld .u{font-size:13.5px;color:var(--text-3);flex-shrink:0;line-height:1.2}
.sf input,.sf select{
  width:100%;min-width:0;background:transparent;border:none;
  color:var(--text);font-size:22px;font-weight:500;line-height:28px;height:28px;
  font-family:var(--font-num);padding:0;
  outline:none;-webkit-appearance:none;appearance:none;border-radius:0;
}
.sf select{
  font-size:17px;cursor:pointer;white-space:nowrap;text-overflow:clip;padding-right:14px;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 7px) 56%,calc(100% - 2px) 56%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
#gender{font-size:17px;padding-right:12px}
.sf input[type=date]{font-size:17px;min-height:28px}
.sf select option{background:var(--surface);color:var(--text)}

/* ── RESULT ROW (BMR / TDEE / เป้าที่ต้องทาน / ทานจริง) ── */
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}

/* ── SUMMARY ── */
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:6px 2px 5px;text-align:center;box-shadow:var(--sh);min-width:0;container-type:inline-size}
.sc-label{font-size:min(13.5px,18.5cqw);font-weight:600;color:var(--text-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:clip}
.sc-val{font-size:min(24px,40cqw);font-weight:600;letter-spacing:-.01em;font-family:var(--font-num);margin-top:2px;line-height:1.15;white-space:nowrap}
.sc-unit{font-size:13.5px;color:var(--text-3);line-height:1.2;white-space:nowrap}
.pb-bg{margin:4px 6px 0;background:var(--track);border-radius:99px;height:4px;overflow:hidden}
.pb{height:4px;border-radius:99px;transition:width .5s ease}
.sc-pct{font-size:13.5px;margin-top:2px;color:var(--text-3);line-height:1.2}
.sum-wrap{min-height:92px;margin-bottom:6px}

/* ── EMPTY STATE ── */
.empty-state{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:92px;padding:8px 14px;text-align:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--sh);
}
.empty-icon{font-size:32px;line-height:1}
.empty-state p{color:var(--text-2);font-size:16px;line-height:1.4}

/* ── FOOD GRID ── */
.food-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px;margin-bottom:6px;box-shadow:var(--sh)}
.food-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.food-item{
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--rsm);padding:5px 3px 6px;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.2,.64,1);text-align:center;
  user-select:none;position:relative;min-width:0;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.food-item:active{transform:scale(.95)}
.food-item:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px}
.food-item.selected{background:var(--surface-2);border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}
.food-check{position:absolute;top:3px;right:3px;width:18px;height:18px;background:var(--primary);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;line-height:1;color:var(--on-primary)}
.food-item.selected .food-check{display:flex}
.food-emoji{font-size:28px;line-height:32px}
.food-name{font-size:15.5px;font-weight:600;line-height:21px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:clip}
.food-cal{font-size:12.5px;line-height:16px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:clip}
/* the stepper row always reserves its space so selecting a food never changes the page height */
.food-qty-row{display:grid;grid-template-columns:26px 1fr 26px;gap:2px;height:34px;visibility:hidden;pointer-events:none}
.food-item.selected .food-qty-row{visibility:visible;pointer-events:auto}
.food-foot{display:grid;align-items:center;height:34px;margin-top:1px}
.food-foot>*{grid-area:1/1}
.food-item.selected .food-cal{visibility:hidden}
.qty-btn{
  width:100%;height:34px;min-width:0;
  border:1.5px solid var(--primary);border-radius:7px;
  background:var(--surface);color:var(--primary);
  font-size:19px;font-weight:700;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  font-family:var(--font-num);
}
.qty-btn:active{background:var(--surface-2);transform:scale(.92)}
.food-qty{
  width:100%;min-width:0;height:34px;background:var(--surface);
  border:1.5px solid var(--primary);border-radius:6px;
  color:var(--primary);font-size:17px;font-weight:700;
  padding:0;outline:none;text-align:center;
  font-family:var(--font-num);
  -webkit-appearance:none;-moz-appearance:textfield;appearance:textfield;
  touch-action:manipulation;
}
.food-qty::-webkit-inner-spin-button,.food-qty::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* ── BTN ── */
.btn{
  width:100%;padding:10px 22px;border-radius:var(--r-btn);
  border:1.5px solid var(--primary);background:var(--primary);
  color:var(--on-primary);font-size:18px;font-weight:700;cursor:pointer;
  font-family:var(--font-display);
  transition:all .2s cubic-bezier(.34,1.2,.64,1);
  display:flex;align-items:center;
  justify-content:center;gap:7px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;min-height:50px;
  margin-top:6px;letter-spacing:0;line-height:1.25;
  box-shadow:0 4px 20px rgba(20,20,20,.2);
}
.btn:active{transform:scale(.97);box-shadow:none;background:var(--primary-dark);border-color:var(--primary-dark)}
.btn:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px}
.btn-auto{margin-left:auto;min-height:36px;padding:4px 14px;border-radius:var(--r-btn);border:1.5px solid var(--primary);background:var(--primary);color:var(--on-primary);font-family:var(--font-display);font-size:15.5px;font-weight:700;letter-spacing:.02em;line-height:1.25;cursor:pointer;transition:transform .15s,background .15s;white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-auto:active{background:var(--primary-dark);transform:scale(.96)}
.btn-auto:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px}
.auto-note{margin:0 0 6px;padding:6px 10px;border-radius:var(--rsm);background:var(--surface);border:1px solid var(--warn);color:var(--text);font-size:14.5px;line-height:1.4}
.auto-note[hidden]{display:none}

/* ── EXPORT OVERLAY (หน้าสรุป) ── */
.export-overlay{
  display:none;position:fixed;inset:0;
  background:var(--surface);
  z-index:999;
  overflow:hidden;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));
}
.export-wrapper{position:relative;width:100%;margin:0}
#export-card{width:100%;position:relative}
.ec{width:100%;border-radius:18px;background:var(--surface);box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden;transform-origin:top left}
.ec-in{width:100%;background:var(--surface);color:var(--text);padding:12px 12px;font-family:var(--font-body);line-height:1.3;box-sizing:border-box}
.ec-date{font-size:16.5px;font-weight:600;color:var(--text-2);line-height:1.25;margin-top:1px;white-space:nowrap}
.ec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1.5px solid var(--border);margin-bottom:10px}
.ec-head-img{width:50px;height:50px;border-radius:10px;flex-shrink:0;display:block}
.ec-head-r{text-align:right;min-width:0}
.ec-title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:0;line-height:1.25;white-space:nowrap}
.ec-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.ec-detail{flex:0 0 64%;min-width:0;display:flex;flex-direction:column;gap:6px}
.ec-k{font-size:14px;color:var(--text-3);line-height:1.2;margin-bottom:1px}
.ec-v{font-size:16px;font-weight:600;color:var(--text);line-height:1.25}
.ec-logo{width:36%;height:auto;object-fit:cover;border-radius:12px;border:0;flex-shrink:0;display:block}
.ec-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.ec-grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.ec-sec .ec-grid5{margin-bottom:0}
.ec-cell{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 1px;text-align:center;min-width:0;container-type:inline-size}
.ec-cell.alt{background:var(--surface-2)}
.ec-cl{font-size:min(13.5px,18cqw);letter-spacing:0;font-weight:700;color:var(--text-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:clip}
.ec-cv{font-size:min(22px,26cqw);font-weight:600;color:var(--text);line-height:1.2;margin-top:1px;font-family:var(--font-num);letter-spacing:-.01em;white-space:nowrap}
.ec-cs{font-size:13.5px;color:var(--text-3);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:clip}
.nw{white-space:nowrap}
.ec-chip{display:inline-block;font-size:min(13.5px,16cqw);font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);line-height:1.3;white-space:nowrap;margin-top:1px}
.ec-bar{margin:4px 5px 0;background:var(--border);border-radius:99px;height:4px;overflow:hidden}
.ec-bar>div{height:4px;border-radius:99px}
.ec-sec{margin-bottom:10px}
.ec-sh{font-size:15.5px;font-weight:700;color:var(--text-2);margin-bottom:5px;line-height:1.25}
.ec-meals{background:var(--surface-2);border-radius:8px;padding:7px 9px}
.ec-mrow{margin-bottom:6px}
.ec-mrow:last-child{margin-bottom:0}
.ec-mh{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:16px;font-weight:700;color:var(--text);line-height:1.25}
.ec-mh span:first-child{color:var(--text-2)}
.ec-pills{display:flex;flex-wrap:wrap;gap:5px}
.ec-pill{display:inline-flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:15px;line-height:1.3;color:var(--text);white-space:nowrap}
.ec-pill b{color:var(--primary-text)}
.ec-hr{border-top:1px solid var(--border);margin:6px 0}
.ec-empty{font-size:14px;color:var(--text-3)}
.ec-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:2px}
.ec-actions{display:flex;align-items:center;gap:8px}
.ec-btn{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--primary);font-family:var(--font-display);font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;line-height:1.2;white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ec-btn:focus-visible{outline:2px solid var(--primary-text);outline-offset:2px}
.ec-btn:disabled{opacity:.6;cursor:default}
.ec-back{background:var(--primary);color:var(--on-primary)}
.ec-back:active{background:var(--primary-dark)}
.ec-shot{background:var(--surface);color:var(--primary-text)}
.ec-shot:active{background:var(--surface-2)}
.shot-preview{position:fixed;inset:0;z-index:1001;background:var(--shot-bg);display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.shot-preview img{max-width:100%;height:auto;border-radius:10px;background:var(--white);-webkit-touch-callout:default;user-select:auto}
.sp-tip{color:var(--white);font-size:16px;line-height:1.35;text-align:center;flex-shrink:0}
.sp-row{display:flex;gap:8px;flex-shrink:0}
.sp-row a.ec-btn{text-decoration:none}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:90vw;padding:9px 16px;border-radius:99px;background:var(--primary-dark);color:var(--on-primary);font-size:15.5px;line-height:1.3;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1000}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── RESPONSIVE ── */
@media(max-width:400px){
  .sc,.ec-cell{padding-left:0;padding-right:0}
  .sf label,.fld .u{font-size:13px}
  .ec-in{padding:10px}
  .ec-btn{font-size:14.5px;padding:0 10px}
}
@media(max-width:370px){
  .fu{display:none}
  .food-name{font-size:15px}
}
@media(max-width:350px){
  .hdr-title{font-size:21px}
  .ec-cs{font-size:12.5px}
  .food-name{font-size:13.5px}
  .summary-grid,.ec-grid4,.ec-grid5{gap:3px}
  .sf{padding-left:6px;padding-right:6px}
  #gender{font-size:15px;padding-right:10px}
  .ec-in{padding:10px 8px}
}
</style>
</head>
<body>

<div class="max-w" id="app-fit">

  <header class="hdr">
    <div class="hdr-title">🥗 โภชนาการแม่นยำ</div>
  </header>

  <div class="sl sl-blue">🙋 ข้อมูลร่างกาย · 📋 ตั้งค่าโปรแกรม</div>
  <div class="card">
    <div class="sg">
      <div class="sf">
        <label for="gender">🚻 เพศ</label>
        <select id="gender">
          <option value="female">👩 หญิง</option>
          <option value="male">👨 ชาย</option>
        </select>
      </div>
      <div class="sf">
        <label for="age">🎂 อายุ</label>
        <div class="fld"><input type="number" inputmode="numeric" id="age" value="50" min="10" max="100"><span class="u">ปี</span></div>
      </div>
      <div class="sf">
        <label for="height">📏 ส่วนสูง</label>
        <div class="fld"><input type="number" inputmode="decimal" id="height" value="170" min="100" max="250"><span class="u">cm</span></div>
      </div>
      <div class="sf">
        <label for="weight">⚖️ น้ำหนัก</label>
        <div class="fld"><input type="number" inputmode="decimal" id="weight" value="96" min="30" max="200"><span class="u">kg</span></div>
      </div>
      <div class="sf s2">
        <label for="start-date">🟢 วันเริ่มโปรแกรม</label>
        <input type="date" id="start-date">
      </div>
      <div class="sf s2 readonly-field">
        <label for="end-date">🔴 วันจบ (อัตโนมัติ)</label>
        <input type="date" id="end-date" readonly tabindex="-1">
      </div>
      <div class="sf s4 inl">
        <label for="activity-level">🏃 กิจกรรม</label>
        <select id="activity-level">
          <option value="1.2">🪑 นั่งอยู่กับที่</option>
          <option value="1.375">🚶 เบา (1-3 วัน)</option>
          <option value="1.55" selected>🏃 ปานกลาง (3-5 วัน)</option>
          <option value="1.725">💪 หนัก (6-7 วัน)</option>
          <option value="1.9">🔥 หนักมาก</option>
        </select>
      </div>
      <div class="sf s4 inl">
        <label for="eating-program">🍽️ โปรแกรม</label>
        <select id="eating-program">
          <option value="">⚪ ทั่วไป (รักษาน้ำหนัก)</option>
          <option value="reset">🔄 ปรับระบบเผาผลาญ</option>
          <option value="firstcut">🔥 ลีนไขมัน รอบ 1</option>
          <option value="deepcut">⚡ ลีนไขมัน รอบ 2</option>
        </select>
      </div>
    </div>
  </div>

  <div class="sl sl-green">📈 ผลการคำนวณ</div>
  <div class="result-grid">
    <div class="sc">
      <div class="sc-label">🔥 BMR</div>
      <div class="sc-val" id="bmr-val" style="color:var(--text)">—</div>
      <div class="sc-unit">kcal/วัน</div>
    </div>
    <div class="sc">
      <div class="sc-label">⚡ TDEE</div>
      <div class="sc-val" id="tdee-val" style="color:var(--accent)">—</div>
      <div class="sc-unit">kcal/วัน</div>
    </div>
    <div class="sc">
      <div class="sc-label">🎯 เป้าหมาย</div>
      <div class="sc-val" id="target-cal-val">—</div>
      <div class="sc-unit">kcal/วัน</div>
    </div>
    <div class="sc">
      <div class="sc-label">🍽️ ทานจริง</div>
      <div class="sc-val" id="actual-cal-val" style="color:var(--text)">—</div>
      <div class="sc-unit">kcal</div>
    </div>
  </div>

  <div class="sum-wrap">
    <div class="summary-grid" id="summary-grid" style="display:none"></div>
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🥗</div>
      <p>👇 เลือกอาหารด้านล่าง<wbr>เพื่อเริ่มคำนวณ</p>
    </div>
  </div>

  <div class="sl sl-green">🍽️ เลือกอาหาร<button type="button" class="btn-auto" id="auto-btn" aria-label="จัดปริมาณอาหารอัตโนมัติตามโปรแกรม">⚡ AUTO</button></div>
  <div class="auto-note" id="auto-note" role="status" hidden></div>
  <div class="food-section">
    <div class="food-grid" id="food-grid"></div>
  </div>

  <button type="button" class="btn" id="view-btn"><span>🖼️</span> ดูสรุปผล</button>

</div><!-- /max-w -->

<!-- ════════ EXPORT OVERLAY ════════ -->
<div id="export-overlay" class="export-overlay">
  <div class="export-wrapper">
    <div id="export-card"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   DATA CONSTANTS
═══════════════════════════════════════════════ */
const FOODS = [
  { name:"ข้าว",       emoji:"🍚", carb:23.5, protein:2.3,  fat:0.8,  fiber:1.8, cal:112, per:"100g",              u:"ทัพพี" },
  { name:"เนื้อสัตว์", emoji:"🥩", carb:0,    protein:21.8, fat:6,    fiber:0,   cal:143, per:"100g",              u:"100g"  },
  { name:"ไข่ต้ม",     emoji:"🥚", carb:0.6,  protein:6.3,  fat:5.3,  fiber:0,   cal:78,  per:"1 ฟอง (~50g)",      u:"ฟอง"   },
  { name:"เวย์โปรตีน", emoji:"🧃", carb:3,    protein:25,   fat:1,    fiber:0,   cal:120, per:"1 scoop (~30g)",    u:"สกู๊ป"  },
  { name:"โยเกิร์ต",  emoji:"🥣", carb:4,    protein:10,   fat:0.8,  fiber:0,   cal:63,  per:"1 ถ้วย (~100g)",    u:"ถ้วย"  },
  { name:"ถั่วลิสง",   emoji:"🥜", carb:4.3,  protein:6.9,  fat:14.5, fiber:2.4, cal:176, per:"30g",               u:"30g"   },
  { name:"ผัก",        emoji:"🥦", carb:5,    protein:1.5,  fat:0.3,  fiber:2,   cal:25,  per:"100g",              u:"100g"  },
  { name:"น้ำมัน",     emoji:"🫒", carb:0,    protein:0,    fat:13.5, fiber:0,   cal:119, per:"1 ช้อนโต๊ะ (~14ml)", u:"ช้อน"  },
];

// Minimum safe daily calorie floor (very-low-calorie diets need medical supervision below this)
const MIN_KCAL = { male:1500, female:1200 };
// โปรแกรมการทาน — single source of truth for the macro ratio per phase.
// Calorie target itself is flat: 80% of TDEE for every program (see getTargets()).
const PROGRAMS = {
  '':       { label:'⚪ ทั่วไป (รักษาน้ำหนัก)',   carb:50, protein:20, fat:30 },
  reset:    { label:'🔄 ปรับระบบเผาผลาญ',      carb:41, protein:32, fat:27 }, // ref: P30-35 / C40-45 / F25-30
  firstcut: { label:'🔥 ลีนไขมัน รอบที่ 1',     carb:35, protein:40, fat:25 }, // ref: P40 / C35 / F25
  deepcut:  { label:'⚡ ลีนไขมัน รอบที่ 2',     carb:23, protein:49, fat:28 }, // ref: P45-50 / C20-25 / F25-30
};

// สีประจำสารอาหารแต่ละหมวด (อ้างอิงตัวแปรสีของธีม)
const COLORS = { cal:'var(--primary)', carb:'var(--warn)', protein:'var(--accent)', fat:'var(--bar-fat)', fiber:'var(--bar-fiber)' };

// อาหารที่สูตร AUTO ใช้ปรับปริมาณ (ลำดับ: ข้าว -> เนื้อสัตว์ -> น้ำมัน)
const RICE = 'ข้าว', MEAT = 'เนื้อสัตว์', OIL = 'น้ำมัน';
const MAIN_FOOD_SET = new Set([RICE, MEAT]);   // แบ่งเป็น 2 มื้อในหน้าสรุป

// ข้าวหุงสุก: ฐานข้อมูลเก็บเป็นหน่วยละ 100 g แต่แสดงผลเป็น "ทัพพี" เท่านั้น (1 ทัพพี = 80 g)
const RICE_G_PER_UNIT = 100, RICE_SCOOP_G = 80, RICE_SCOOP_STEP = 0.5;   // ปัดเศษที่ละครึ่งทัพพี
const riceScoops  = qty    => qty    * RICE_G_PER_UNIT / RICE_SCOOP_G;
const scoopsToQty = scoops => scoops * RICE_SCOOP_G / RICE_G_PER_UNIT;

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let selected = {};


/* ═══════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// Escape HTML to prevent XSS when inserting user data into innerHTML
function escHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Fit a block into ONE screen with transform:scale (no scroll).
// Measures the natural size via getBoundingClientRect and scales to the free height, centred horizontally.
// Scales down to the floor; scales up (tall phones) only while the laid-out width stays >= FIT_MIN_NATURAL_W.
const FIT_MIN_SCALE = 0.5;        // readability floor
const FIT_MAX_SCALE = 1.12;       // use spare height on tall screens for bigger text
const FIT_MIN_NATURAL_W = 375;    // narrowest layout width the design was verified at
function fitViewport(target, container) {
  if (!target || !container) return;
  const cs = getComputedStyle(container);
  const padL = parseFloat(cs.paddingLeft) || 0;
  const padR = parseFloat(cs.paddingRight) || 0;
  const padB = parseFloat(cs.paddingBottom) || 0;
  const availW = container.clientWidth - padL - padR;
  target.style.transform = 'none';
  // Width is not fixed: widen the block by 1/scale so that, once scaled, it fills the full
  // screen width (no side gaps); re-measure a few times because a wider block gets shorter.
  const maxScale = Math.max(1, Math.min(FIT_MAX_SCALE, availW / FIT_MIN_NATURAL_W));
  let scale = 1, r;
  for (let i = 0; i < 5; i++) {
    target.style.width = (availW / scale) + 'px';
    r = target.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const next = Math.max(FIT_MIN_SCALE, Math.min(maxScale, (window.innerHeight - r.top - padB) / r.height));
    if (Math.abs(next - scale) < 0.004) { scale = next; break; }
    scale = next;
  }
  const room = window.innerHeight - r.top - padB;
  target.style.width = (availW / scale) + 'px';
  r = target.getBoundingClientRect();
  if (r.height * scale > room + 0.5) {                // loop did not settle: shrink until it fits
    for (let i = 0; i < 6 && r.height * scale > room + 0.5 && scale > FIT_MIN_SCALE; i++) {
      scale = Math.max(FIT_MIN_SCALE, scale * room / (r.height * scale) - 0.002);
      target.style.width = (availW / scale) + 'px';
      r = target.getBoundingClientRect();
    }
  }
  const overflow = r.height * scale > room + 1;
  target.style.transformOrigin = '0 0';
  target.style.transform = `translate(${padL - r.left}px, 0) scale(${scale})`;
  container.style.overflowY = overflow ? 'auto' : 'hidden'; // safety net below the floor
}
let baseInnerH = window.innerHeight;
const isEditing = () => /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
function fitAll() {
  // ignore the shrink caused by the on-screen keyboard
  if (isEditing() && window.innerHeight < baseInnerH * 0.8) return;
  if (!isEditing()) baseInnerH = window.innerHeight;
  fitViewport($('app-fit'), document.body);
  const ov = $('export-overlay');
  if (ov && ov.style.display === 'block') fitViewport($('ec-outer'), ov);
}

/* ═══════════════════════════════════════════════
   NUTRITION CALC
═══════════════════════════════════════════════ */
function getTotals() {
  return Object.entries(selected).reduce((acc, [name, qty]) => {
    const f = FOODS.find(x => x.name === name);
    if (!f) return acc;
    acc.carb    += f.carb    * qty;
    acc.protein += f.protein * qty;
    acc.fat     += f.fat     * qty;
    acc.fiber   += f.fiber   * qty;
    acc.cal     += f.cal     * qty;
    return acc;
  }, { carb:0, protein:0, fat:0, fiber:0, cal:0 });
}

const LIMITS   = { age:[10,100], height:[100,250], weight:[30,200] };
const DEFAULTS = { age:50, height:170, weight:96 };

function clampNum(v, min, max, fallback) {
  const n = parseFloat(v);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}
// Sanitised body data (blank / NaN -> defaults, out-of-range -> clamped)
function readBody() {
  return {
    g: $('gender').value === 'male' ? 'male' : 'female',
    a: Math.round(clampNum($('age').value,    ...LIMITS.age,    DEFAULTS.age)),
    h: Math.round(clampNum($('height').value, ...LIMITS.height, DEFAULTS.height) * 10) / 10,
    w: Math.round(clampNum($('weight').value, ...LIMITS.weight, DEFAULTS.weight) * 10) / 10,
  };
}
function normalizeBodyInputs() {
  const b = readBody();
  $('age').value = b.a; $('height').value = b.h; $('weight').value = b.w;
}

// Mifflin-St Jeor (kcal/day) — unrounded, never negative
function getBMR(w, h, a, g) {
  return Math.max(0, 10*w + 6.25*h - 5*a + (g === 'male' ? 5 : -161));
}
// Pure: body {w,h,a,g} + activity multiplier + program key -> daily targets
function computeTargets(body, act, progKey) {
  const prog   = PROGRAMS[progKey] || PROGRAMS[''];
  const bmrRaw = getBMR(body.w, body.h, body.a, body.g);
  const tdee   = Math.round(bmrRaw * act);
  const floor  = MIN_KCAL[body.g] || MIN_KCAL.female;
  // เป้าที่ต้องทาน = 80% ของ TDEE เสมอ — ไม่ต่ำกว่า floor ที่ปลอดภัย แต่ floor ต้องไม่ทำให้เป้าเกิน TDEE
  const cal     = Math.max(Math.min(floor, tdee), Math.round(tdee * 0.8));
  const carb    = Math.round(cal * prog.carb    / 100 / 4);
  const protein = Math.round(cal * prog.protein / 100 / 4);
  // fat closes the kcal gap so the three macros reconcile with the calorie target
  const fat     = Math.max(0, Math.round((cal - carb * 4 - protein * 4) / 9));
  return { tdee, bmr: Math.round(bmrRaw), cal, carb, protein, fat, fiber:25 };
}
function getTargets() {
  const act = clampNum($('activity-level').value, 1.2, 1.9, 1.55);
  return computeTargets(readBody(), act, $('eating-program')?.value || '');
}

/* ── หน่วยจำนวน: ข้าวเก็บเป็นหน่วย 100 g แต่ "แสดง/พิมพ์/กดปุ่ม" เป็นทัพพี (ครึ่งทัพพีต่อขั้น)
      เพื่อให้เลขที่เห็น = เลขที่ใช้คำนวณแคลอรี่ทุกจุด ── */
const QTY_MIN = 0.5, QTY_MAX = 99;
const qtyMinOf  = name => name === RICE ? scoopsToQty(RICE_SCOOP_STEP) : QTY_MIN;
const qtyMaxOf  = name => name === RICE ? scoopsToQty(QTY_MAX) : QTY_MAX;
const qtyStepOf = name => name === RICE ? scoopsToQty(RICE_SCOOP_STEP) : 0.5;
const defaultQty = name => name === RICE ? scoopsToQty(1) : 1;
const toDisp   = (name, q) => name === RICE ? Math.round(riceScoops(q) / RICE_SCOOP_STEP) * RICE_SCOOP_STEP : q;
const fromDisp = (name, d) => name === RICE ? scoopsToQty(Math.round(d / RICE_SCOOP_STEP) * RICE_SCOOP_STEP) : d;
const fmtNum   = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10);
const escAttr  = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');

function renderFoods() {
  // Preserve which input has focus before re-render
  const focusedFood = document.activeElement?.dataset?.food || null;
  const focusedItem = document.activeElement?.classList?.contains('food-item') ? document.activeElement.dataset.name : null;

  $('food-grid').innerHTML = FOODS.map(f => {
    const sel  = selected[f.name] != null;
    const en   = escAttr(f.name);
    const cal  = f.name === RICE ? Math.round(f.cal * RICE_SCOOP_G / RICE_G_PER_UNIT) : f.cal;   // ข้าว: kcal ต่อ 1 ทัพพี
    const disp = fmtNum(sel ? toDisp(f.name, selected[f.name]) : toDisp(f.name, defaultQty(f.name)));
    return `
    <div class="food-item ${sel ? 'selected' : ''}" role="button" tabindex="0" aria-pressed="${sel ? 'true' : 'false'}" data-name="${en}">
      <div class="food-check">✓</div>
      <div class="food-emoji">${f.emoji}</div>
      <div class="food-name">${escHtml(f.name)}</div>
      <div class="food-foot">
      <div class="food-cal">${cal} kcal<span class="fu">/${f.u}</span></div>
      <div class="food-qty-row">
        <button type="button" class="qty-btn" data-action="dec" data-food="${en}" aria-label="ลด ${escAttr(f.name)}">−</button>
        <input class="food-qty" type="number" inputmode="decimal" min="0.5" max="${QTY_MAX}" step="0.5"
          value="${disp}" data-food="${en}"
          aria-label="${escAttr(f.name)} จำนวน (${f.u})">
        <button type="button" class="qty-btn" data-action="inc" data-food="${en}" aria-label="เพิ่ม ${escAttr(f.name)}">+</button>
      </div>
      </div>
    </div>`;
  }).join('');

  // Restore focus to previously-focused food qty input
  if (focusedFood) {
    const el = document.querySelector(`.food-qty[data-food="${CSS.escape(focusedFood)}"]`);
    if (el) { el.focus(); el.select(); }
  } else if (focusedItem) {
    document.querySelector(`.food-item[data-name="${CSS.escape(focusedItem)}"]`)?.focus();
  }
}

function bindFoodGridEvents() {
  const grid = $('food-grid');
  if (!grid) return;

  // Toggle food selection — skip if tap was on the qty input or +/- buttons
  grid.addEventListener('click', e => {
    const stepBtn = e.target.closest('.qty-btn');
    if (stepBtn) {
      e.stopPropagation();
      stepQty(stepBtn.dataset.food, stepBtn.dataset.action === 'inc' ? 1 : -1);
      return;
    }
    if (e.target.closest('.food-qty-row')) return;
    const item = e.target.closest('.food-item');
    if (!item) return;
    toggleFood(item.dataset.name);
  });

  // keyboard: Enter / Space toggles a focused food card
  grid.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('food-item')) {
      e.preventDefault();
      toggleFood(e.target.dataset.name);
    }
  });
  // live update while typing (ignore an empty / half-typed field — it is normalised on change)
  grid.addEventListener('input', e => {
    const el = e.target;
    if (!el.classList.contains('food-qty')) return;
    if (!Number.isFinite(parseFloat(el.value))) return;
    updateQty(el.dataset.food, el.value);
  });
  // on blur / enter snap the field to the normalised value
  grid.addEventListener('change', e => {
    const el = e.target;
    if (!el.classList.contains('food-qty')) return;
    updateQty(el.dataset.food, el.value);
    const q = selected[el.dataset.food];
    if (q != null) el.value = fmtNum(toDisp(el.dataset.food, q));
  });
}

function toggleFood(name) {
  if (selected[name] != null) delete selected[name];
  else selected[name] = defaultQty(name);
  renderFoods();
  renderSummary();
}

// stored quantity (units of the DB "per" column): clamp, then one decimal place
function normQty(name, v) {
  const n = parseFloat(v);
  if (!Number.isFinite(n)) return qtyMinOf(name);
  return Math.min(qtyMaxOf(name), Math.max(qtyMinOf(name), Math.round(n * 10) / 10));
}
function updateQty(name, dispVal) {
  if (selected[name] == null) return;                 // food was deselected before the event fired
  const d = parseFloat(dispVal);
  selected[name] = normQty(name, Number.isFinite(d) ? fromDisp(name, d) : NaN);
  renderSummary();
}
function stepQty(name, dir) {
  if (selected[name] == null) return;
  selected[name] = normQty(name, selected[name] + dir * qtyStepOf(name));
  const input = document.querySelector(`.food-qty[data-food="${CSS.escape(name)}"]`);
  if (input) input.value = fmtNum(toDisp(name, selected[name]));
  renderSummary();
}

/* ═══════════════════════════════════════════════
   AUTO PORTION — จัดปริมาณอาหารตามสารอาหารเป้าหมายของโปรแกรมที่เลือก
   Foods other than rice / meat / oil keep their current quantity (fixed base).
   The three solvers then close the remaining gap, each step subtracting everything already placed:
     1) ข้าว  — the only carb source            -> carbs   (steps of ½ ทัพพี = 40 g)
     2) เนื้อสัตว์ — protein left after rice's own -> protein (steps of 10 g)
     3) น้ำมัน — fat left after all others (slack) -> fat     (steps of ½ tbsp)
   (meat and oil carry 0 g carbs, oil 0 g protein, so this order solves the system exactly;
    rice is snapped first, so meat and oil absorb the protein/fat that the rounded rice adds)
═══════════════════════════════════════════════ */
const AUTO_FOODS = [RICE, MEAT, OIL];
function solvePortions(t, fixed) {
  const food = n => FOODS.find(f => f.name === n);
  const S = { carb:0, protein:0, fat:0 };
  Object.entries(fixed).forEach(([n, q]) => {
    const f = food(n);
    if (f) { S.carb += f.carb * q; S.protein += f.protein * q; S.fat += f.fat * q; }
  });
  const rice = food(RICE), meat = food(MEAT), oil = food(OIL);
  const snap  = (v, step) => Math.round(Math.max(0, v) / step) * step;
  const place = (v, min = QTY_MIN) => {     // respect the minimum: below it -> nearest of 0 / min
    const q = Math.round(v * 10) / 10;
    if (q < min) return q >= min / 2 ? min : 0;
    return Math.min(QTY_MAX, q);
  };
  const riceStep = scoopsToQty(RICE_SCOOP_STEP);                                               // ½ ทัพพี = 0.4 หน่วย
  const r = place(snap((t.carb - S.carb) / rice.carb, riceStep), 2 * riceStep);                // ขั้นต่ำ 1 ทัพพี
  const m = place(snap((t.protein - S.protein - r * rice.protein) / meat.protein, 0.1));       // 10 g steps
  const o = place(snap((t.fat - S.fat - r * rice.fat - m * meat.fat) / oil.fat, 0.5));         // ½ tbsp steps
  return { [RICE]: r, [MEAT]: m, [OIL]: o };
}
let autoTimer = null;
function autoPortion() {
  const fixed = {};
  Object.keys(selected).forEach(n => { if (!AUTO_FOODS.includes(n)) fixed[n] = selected[n]; });
  const tgt = getTargets();
  const res = solvePortions(tgt, fixed);
  AUTO_FOODS.forEach(n => { if (res[n] > 0) selected[n] = res[n]; else delete selected[n]; });
  renderFoods();
  renderSummary();
  // Fixed foods (eggs, nuts, …) can already carry more of a macro than the program allows — say so
  const tot = getTotals(), over = [];
  [['carb','คาร์โบไฮเดรต'], ['protein','โปรตีน'], ['fat','ไขมัน']].forEach(([k, label]) => {
    const d = Math.round(tot[k] - tgt[k]);
    if (d > 3 && tot[k] > tgt[k] * 1.05) over.push(`${label} +${d}g`);
  });
  const note = $('auto-note');
  note.textContent = over.length ? `⚠️ เกินเป้า: ${over.join(' · ')} — ลองลดหรือเอาอาหารเสริม (ไข่/ถั่ว\u00A0ฯลฯ) ออก แล้วกด\u00A0AUTO\u00A0อีกครั้ง` : '';
  note.hidden = !over.length;
  const btn = $('auto-btn');
  if (btn) {
    btn.textContent = '✓ AUTO';
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => { btn.textContent = '⚡ AUTO'; }, 1200);
  }
}

function renderSummary() {
  const an = $('auto-note'); if (an) an.hidden = true;   // a manual edit makes the AUTO note stale
  const has = Object.keys(selected).length > 0;
  $('empty-state').style.display    = has ? 'none'  : 'flex';
  $('summary-grid').style.display   = has ? 'grid'  : 'none';
  const actualCalEl = $('actual-cal-val');
  if (actualCalEl) actualCalEl.textContent = has ? Math.round(getTotals().cal).toLocaleString() : '0';
  if (!has) return;
  const t = getTotals(), g = getTargets();
  const items = [
    {label:"🔥 แคลอรี่", val:Math.round(t.cal),     unit:"kcal", color:COLORS.cal,     target:g.cal},
    {label:"🍚 คาร์บ",   val:Math.round(t.carb),    unit:"g",    color:COLORS.carb,    target:g.carb},
    {label:"🥩 โปรตีน",  val:Math.round(t.protein),  unit:"g",    color:COLORS.protein, target:g.protein},
    {label:"🧈 ไขมัน",   val:Math.round(t.fat),      unit:"g",    color:COLORS.fat,     target:g.fat},
    {label:"🌾 ไฟเบอร์", val:Math.round(t.fiber),    unit:"g",    color:COLORS.fiber,   target:g.fiber},
  ];
  $('summary-grid').innerHTML = items.map(it => {
    const pct = it.target>0 ? Math.min(Math.round(it.val/it.target*100),999) : 0;
    const over = pct > 100;
    return `<div class="sc">
      <div class="sc-label">${it.label}</div>
      <div class="sc-val" style="color:var(--text)">${it.val.toLocaleString()}</div>
      <div class="sc-unit">${it.unit}</div>
      <div class="pb-bg"><div class="pb" style="width:${Math.min(pct,100)}%;background:${it.color}"></div></div>
      <div class="sc-pct" style="color:${over?'var(--danger)':'var(--text-3)'}">${pct}%</div>
    </div>`;
  }).join('');
}

function isMainFood(name) { return MAIN_FOOD_SET.has(name); }

function fmtQty(f) {
  const per = f.per || '', qty = f.qty;
  // ข้าว: แสดงเป็น "ทัพพี" (1 ทัพพี = 80 g) ปัดทีละครึ่งทัพพี แล้วตามด้วยกรัมในวงเล็บ
  if (f.name === RICE) {
    const scoops = Math.round(riceScoops(qty) / RICE_SCOOP_STEP) * RICE_SCOOP_STEP;
    return `${fmtNum(scoops)} ทัพพี (${Math.round(scoops * RICE_SCOOP_G)} g)`;
  }
  if (per.includes('ฟอง'))      return `${fmtNum(qty)} ฟอง`;
  if (per.includes('ถ้วย'))     return `${fmtNum(qty)} ถ้วย`;
  if (per.includes('scoop'))    return `${fmtNum(qty)} สกู๊ป`;
  if (per.includes('ช้อนโต๊ะ')) return `${fmtNum(qty)} ช้อนโต๊ะ`;
  const gm = per.match(/(\d+)\s*g\b/);
  return gm ? `${Math.round(parseInt(gm[1], 10) * qty)} g` : fmtNum(qty);
}

// แบ่งอาหารหลักเป็น 2 มื้อ -> [มื้อแรก, มื้อสุดท้าย] (หน่วยเดียวกับ qty)
// ข้าวแบ่งเป็นขั้นครึ่งทัพพีที่รวมกันได้เท่ากับยอดที่ปัดแล้วพอดี (มื้อแรกได้ส่วนที่เกิน)
function splitMeals(f) {
  if (f.name !== RICE) return [f.qty / 2, f.qty / 2];
  const steps = Math.round(riceScoops(f.qty) / RICE_SCOOP_STEP);
  const first = Math.ceil(steps / 2);
  return [first, steps - first].map(n => scoopsToQty(n * RICE_SCOOP_STEP));
}

// Body composition. LBM = mean(Boer 1984 capped at body weight, Deurenberg 1991);
// BFM = weight - LBM (kept within 2-70% of weight); %Fat = BFM / weight.
// BFM is rounded to 1 decimal first and LBM = weight - rounded BFM, so LBM + BFM equals body weight exactly.
function calcBodyComp(w, h, a, g) {
  const male = g === 'male';
  const bmi  = w / ((h / 100) ** 2);
  const boer = Math.min(w, Math.max(0, male ? 0.407*w + 0.267*h - 19.2 : 0.252*w + 0.473*h - 48.3));
  const pctD = Math.min(70, Math.max(2, 1.2*bmi + 0.23*a - 10.8*(male ? 1 : 0) - 5.4));
  const lbm  = (boer + w * (1 - pctD / 100)) / 2;
  const bfmRaw = Math.min(w * 0.7, Math.max(w * 0.02, w - lbm));
  const bfm  = Math.round(bfmRaw * 10) / 10;
  const lbmR = Math.round((w - bfm) * 10) / 10;
  return { bmi, lbm: lbmR, bfm, bf: Math.round(bfm / w * 1000) / 10 };
}
function getBodyComp(w, h, a, g) {
  if (!(w > 0 && h > 0 && a > 0)) return null;
  const { bmi: bmiRaw, lbm, bfm, bf } = calcBodyComp(w, h, a, g);
  const bmi = Math.round(bmiRaw * 10) / 10;
  // IBW — Devine formula
  const ibw = Math.round(((g === 'male' ? 50 : 45.5) + 2.3 * ((h - 152.4) / 2.54)) * 10) / 10;

  // BMI classification — Asian-adjusted (WHO Asia-Pacific ≥23 overweight, ≥27.5 obese)
  let bmiLabel, bmiColor;
  if (bmi < 18.5)      { bmiLabel = '🔵 ผอม';        bmiColor = 'var(--warn)'; }
  else if (bmi < 23)   { bmiLabel = '🟢 ปกติ';       bmiColor = 'var(--primary-text)'; }
  else if (bmi < 27.5) { bmiLabel = '🟡 น้ำหนักเกิน'; bmiColor = 'var(--warn)'; }
  else                 { bmiLabel = '🔴 อ้วน';        bmiColor = 'var(--danger)'; }

  // Body fat classification
  let bfLabel, bfColor;
  if (g === 'male') {
    if (bf < 6) { bfLabel = '🔵 จำเป็น'; bfColor = 'var(--warn)'; }
    else if (bf < 14) { bfLabel = '🟢 นักกีฬา'; bfColor = 'var(--primary-text)'; }
    else if (bf < 18) { bfLabel = '🟢 ฟิต'; bfColor = 'var(--primary-text)'; }
    else if (bf < 25) { bfLabel = '🟡 ทั่วไป'; bfColor = 'var(--warn)'; }
    else { bfLabel = '🔴 อ้วน'; bfColor = 'var(--danger)'; }
  } else {
    if (bf < 14) { bfLabel = '🔵 จำเป็น'; bfColor = 'var(--warn)'; }
    else if (bf < 21) { bfLabel = '🟢 นักกีฬา'; bfColor = 'var(--primary-text)'; }
    else if (bf < 25) { bfLabel = '🟢 ฟิต'; bfColor = 'var(--primary-text)'; }
    else if (bf < 32) { bfLabel = '🟡 ทั่วไป'; bfColor = 'var(--warn)'; }
    else { bfLabel = '🔴 อ้วน'; bfColor = 'var(--danger)'; }
  }
  return { bmi, ibw, lbm, bfm, bf, bmiLabel, bmiColor, bfLabel, bfColor };
}

/* ═══════════════════════════════════════════════
   PROGRAM DATE RANGE — end date = start + 27 days (28-day program)
═══════════════════════════════════════════════ */
const PROGRAM_DAYS = 28;
function calcEndDateISO(startISO) {
  if (!startISO) return '';
  const d = new Date(startISO + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + (PROGRAM_DAYS - 1));
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function syncEndDate() {
  const startEl = $('start-date');
  const endEl   = $('end-date');
  if (!startEl || !endEl) return;
  endEl.value = calcEndDateISO(startEl.value);
}

function updateSettings() {
  const tgt = getTargets();
  $('bmr-val').textContent  = tgt.bmr.toLocaleString();
  $('tdee-val').textContent = tgt.tdee.toLocaleString();
  $('target-cal-val').textContent = tgt.cal.toLocaleString();
  renderSummary();
}

/* ═══════════════════════════════════════════════
   จับภาพหน้าสรุป -> PNG
   ไม่พึ่งไลบรารี/เน็ต: วาดการ์ดลง canvas จากตำแหน่ง/สี/ฟอนต์ของ DOM จริง
   กดแล้วบันทึกไฟล์ PNG ลงโฟลเดอร์ดาวน์โหลดของมือถือทันที (ภาพถูกสร้างไว้ล่วงหน้าตอนเปิดหน้าสรุป)
═══════════════════════════════════════════════ */
const SHOT_SCALE = 3;
let shotBusy = false;

function toast(msg) {
  let el = $('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ── วาดการ์ดลง canvas ตรงๆ จาก DOM ที่แสดงอยู่จริง ──
   ตำแหน่ง สี และฟอนต์ มาจากหน้าจอจริงทั้งหมด (รวมเว็บฟอนต์ที่โหลดไว้แล้ว) ตัวอักษรจึงไม่เพี้ยน ไม่ล้น ไม่ถูกตัด
   (วิธี SVG เดิมโหลดเว็บฟอนต์ไม่ได้ ข้อความในป้ายมื้ออาหารจึงล้นกล่อง) */
const px = v => parseFloat(v) || 0;
const isClear = c => !c || c === 'transparent' || /^rgba\(\s*\d+,\s*\d+,\s*\d+,\s*0\s*\)$/.test(c);

function radiiOf(cs, w, h) {
  const one = v => Math.max(0, Math.min(String(v).endsWith('%') ? px(v) / 100 * w : px(v), w / 2, h / 2));
  return [cs.borderTopLeftRadius, cs.borderTopRightRadius, cs.borderBottomRightRadius, cs.borderBottomLeftRadius].map(one);
}

function roundPath(ctx, x, y, w, h, [tl, tr, br, bl]) {
  ctx.beginPath();
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y);  ctx.arcTo(x + w, y, x + w, y + tr, tr);
  ctx.lineTo(x + w, y + h - br); ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
  ctx.lineTo(x + bl, y + h);  ctx.arcTo(x, y + h, x, y + h - bl, bl);
  ctx.lineTo(x, y + tl);      ctx.arcTo(x, y, x + tl, y, tl);
  ctx.closePath();
}

function paintBox(ctx, cs, x, y, w, h) {
  const r = radiiOf(cs, w, h);
  if (!isClear(cs.backgroundColor)) { roundPath(ctx, x, y, w, h, r); ctx.fillStyle = cs.backgroundColor; ctx.fill(); }
  const bw = [cs.borderTopWidth, cs.borderRightWidth, cs.borderBottomWidth, cs.borderLeftWidth].map(px);
  const bc = [cs.borderTopColor, cs.borderRightColor, cs.borderBottomColor, cs.borderLeftColor];
  const bs = [cs.borderTopStyle, cs.borderRightStyle, cs.borderBottomStyle, cs.borderLeftStyle];
  if (bw.every((v, i) => v > 0 && v === bw[0] && bs[i] === 'solid' && bc[i] === bc[0])) {     // กรอบรอบด้านเท่ากัน (การ์ด, ชิป, พิล)
    const k = bw[0] / 2;
    roundPath(ctx, x + k, y + k, w - bw[0], h - bw[0], r.map(v => Math.max(0, v - k)));
    ctx.lineWidth = bw[0]; ctx.strokeStyle = bc[0]; ctx.stroke();
  } else {                                                                                       // เส้นขอบด้านเดียว (เส้นคั่น)
    ctx.fillStyle = bc[0]; if (bw[0] > 0 && bs[0] === 'solid') { ctx.fillStyle = bc[0]; ctx.fillRect(x, y, w, bw[0]); }
    if (bw[2] > 0 && bs[2] === 'solid') { ctx.fillStyle = bc[2]; ctx.fillRect(x, y + h - bw[2], w, bw[2]); }
    if (bw[3] > 0 && bs[3] === 'solid') { ctx.fillStyle = bc[3]; ctx.fillRect(x, y, bw[3], h); }
    if (bw[1] > 0 && bs[1] === 'solid') { ctx.fillStyle = bc[1]; ctx.fillRect(x + w - bw[1], y, bw[1], h); }
  }
}

function paintImage(ctx, el, cs, x, y, w, h) {
  if (!el.complete || !el.naturalWidth) return;
  const nw = el.naturalWidth, nh = el.naturalHeight;
  let sx = 0, sy = 0, sw = nw, sh = nh, dx = x, dy = y, dw = w, dh = h;
  if (cs.objectFit === 'contain') {
    const k = Math.min(w / nw, h / nh);
    dw = nw * k; dh = nh * k; dx = x + (w - dw) / 2; dy = y + (h - dh) / 2;
  } else if (cs.objectFit === 'cover') {
    const k = Math.max(w / nw, h / nh);
    sw = w / k; sh = h / k; sx = (nw - sw) / 2; sy = (nh - sh) / 2;
  }
  ctx.save();
  roundPath(ctx, x, y, w, h, radiiOf(cs, w, h));       // มุมโค้งของโลโก้ต้องตรงกับบนจอ
  ctx.clip();
  ctx.drawImage(el, sx, sy, sw, sh, dx, dy, dw, dh);
  ctx.restore();
}

// วาดข้อความทีละบรรทัดตามที่เบราว์เซอร์จัดวางจริง (อ่านตำแหน่งตัวอักษรจาก Range)
function textLines(node) {
  const text = node.data, range = document.createRange(), lines = [];
  let cur = null;
  for (let i = 0; i < text.length;) {
    const code = text.charCodeAt(i), len = (code >= 0xD800 && code <= 0xDBFF) ? 2 : 1, ch = text.substr(i, len);
    range.setStart(node, i); range.setEnd(node, i + len);
    const rc = range.getClientRects()[0], boxed = rc && rc.height > 0;
    i += len;
    if (/^\s$/.test(ch) && !(boxed && rc.width > 0)) continue;                 // ช่องว่างที่ถูกยุบ ไม่ได้แสดง
    if (boxed && rc.width > 0) {
      const cy = (rc.top + rc.bottom) / 2;
      if (!cur || Math.abs(cy - cur.cy) > cur.h * 0.6) { cur = { t: '', x: rc.left, top: rc.top, h: rc.height, cy, primary: false }; lines.push(cur); }
    }
    if (!cur) continue;
    cur.t += ch;
    if (boxed && !cur.primary && code < 0x2000 && !/^\s$/.test(ch)) { cur.top = rc.top; cur.primary = true; }   // อ้างอิงบรรทัดฐานจากฟอนต์หลัก ไม่ใช่อีโมจิ
  }
  return lines;
}

function drawSpaced(ctx, text, x, y, ls, ws) {                                  // สำรองเมื่อ canvas ไม่รองรับ letterSpacing
  const parts = (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text)].map(s => s.segment) : Array.from(text);
  let cx = x;
  for (const g of parts) { ctx.fillText(g, cx, y); cx += ctx.measureText(g).width + ls + (g === ' ' ? ws : 0); }
}

function paintText(ctx, node, cs, ox, oy) {
  if (!node.data.trim()) return;
  ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  ctx.fillStyle = cs.color; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const ls = cs.letterSpacing === 'normal' ? 0 : px(cs.letterSpacing), ws = cs.wordSpacing === 'normal' ? 0 : px(cs.wordSpacing);
  const native = 'letterSpacing' in ctx;
  if (native) { ctx.letterSpacing = ls + 'px'; ctx.wordSpacing = ws + 'px'; }
  for (const ln of textLines(node)) {
    const t = ln.t.trimEnd(); if (!t) continue;
    const asc = Math.round(ctx.measureText('ก').fontBoundingBoxAscent || px(cs.fontSize) * 0.9);
    const x = ln.x - ox, y = ln.top - oy + asc;
    if (native || (!ls && !ws)) ctx.fillText(t, x, y); else drawSpaced(ctx, t, x, y, ls, ws);
  }
  if (native) { ctx.letterSpacing = '0px'; ctx.wordSpacing = '0px'; }
}

function paintTree(ctx, el, ox, oy) {
  const cs = getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden' || el.matches('.ec-actions')) return;   // ไม่เอาปุ่มลงในภาพ
  const r = el.getBoundingClientRect(), x = r.left - ox, y = r.top - oy;
  paintBox(ctx, cs, x, y, r.width, r.height);
  if (el.tagName === 'IMG') paintImage(ctx, el, cs, x, y, r.width, r.height);
  for (const n of el.childNodes) {
    if (n.nodeType === 1) paintTree(ctx, n, ox, oy);
    else if (n.nodeType === 3) paintText(ctx, n, cs, ox, oy);
  }
}

async function renderCardBlob() {
  const root = $('ec-outer');
  if (!root) throw new Error('no card');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const W = root.offsetWidth, H = root.offsetHeight;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W * SHOT_SCALE); canvas.height = Math.round(H * SHOT_SCALE);
  const ctx = canvas.getContext('2d');
  ctx.scale(SHOT_SCALE, SHOT_SCALE);
  ctx.fillStyle = cssVar('--white'); ctx.fillRect(0, 0, W, H);
  const keep = root.style.transform;
  root.style.transform = 'none';                         // อ่านตำแหน่งที่ขนาดจริง (ไม่ผ่านการย่อให้พอดีจอ) แล้วคืนค่าทันที ไม่มีผลต่อภาพบนจอ
  try {
    const rr = root.getBoundingClientRect();
    paintTree(ctx, root, rr.left, rr.top);
  } finally { root.style.transform = keep; }
  return new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
}

function shotFileName() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  return `nutrition-summary-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.png`;
}

// เบราว์เซอร์ที่บล็อกการดาวน์โหลดไฟล์ (แอป LINE/Facebook/Instagram, WebView, และ Chrome/Firefox/Edge บน iPhone) -> ใช้หน้าแสดงภาพให้กดค้างบันทึกแทน
// Chrome บน Android และ Safari บน iPhone ดาวน์โหลดตรงได้
const needsPreviewSave = () => /FBAN|FBAV|Instagram|Line\/|MicroMessenger|KAKAOTALK|Snapchat|Messenger|; wv\)|CriOS|FxiOS|EdgiOS/i.test(navigator.userAgent || '');

/* สร้างภาพไว้ล่วงหน้าตั้งแต่เปิดหน้าสรุป เพื่อให้ดาวน์โหลดได้ทันทีในจังหวะที่แตะปุ่ม
   (เบราว์เซอร์มือถือหลายตัวไม่ยอมให้ดาวน์โหลดถ้าต้องรอสร้างภาพหลังแตะ) */
let shotBlob = null, shotTok = 0, previewUrl = null;
function prepareShot() {
  const tok = ++shotTok;
  shotBlob = null;
  renderCardBlob().then(b => { if (tok === shotTok) shotBlob = b; }).catch(() => {});
}
function discardShot() { shotTok++; shotBlob = null; closePreview(); }

function closePreview() {
  const box = $('shot-preview');
  if (box) box.remove();
  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
}

function showPreview(blob, name) {
  closePreview();
  previewUrl = URL.createObjectURL(blob);
  const box = document.createElement('div');
  box.id = 'shot-preview'; box.className = 'shot-preview'; box.setAttribute('role', 'dialog');
  const tip = document.createElement('div'); tip.className = 'sp-tip';
  tip.textContent = '📲 กดค้างที่รูป แล้วเลือก "บันทึกรูปภาพ"';
  const img = document.createElement('img'); img.src = previewUrl; img.alt = 'ภาพสรุปโภชนาการ';
  const row = document.createElement('div'); row.className = 'sp-row';
  const dl = document.createElement('a'); dl.className = 'ec-btn ec-back'; dl.href = previewUrl; dl.download = name; dl.textContent = '💾 ดาวน์โหลด';
  const cl = document.createElement('button'); cl.type = 'button'; cl.className = 'ec-btn ec-shot'; cl.textContent = '✖️ ปิด'; cl.onclick = closePreview;
  row.append(dl, cl); box.append(tip, row, img);
  document.body.appendChild(box);
}

function saveBlob(blob) {
  const name = shotFileName();
  if (needsPreviewSave() || !('download' in HTMLAnchorElement.prototype)) { showPreview(blob, name); return; }
  // บันทึกลงโฟลเดอร์ดาวน์โหลดของเครื่องโดยตรง (ไม่ผ่านแผ่นแชร์)
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('✅ บันทึกภาพลงโฟลเดอร์ดาวน์โหลดแล้ว');
}

function captureCard() {
  if (shotBusy) return;
  if (shotBlob) {                                   // พร้อมแล้ว: ดาวน์โหลดทันทีภายในการแตะ
    shotBusy = true;
    setTimeout(() => { shotBusy = false; }, 1200);  // กันกดรัวได้ไฟล์ซ้ำ
    saveBlob(shotBlob);
    return;
  }
  captureSlow();                                    // ยังสร้างไม่เสร็จ (กดเร็วมาก): สร้างแล้วบันทึก
}

async function captureSlow() {
  shotBusy = true;
  const btn = $('ec-shot'), label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ รอสักครู่'; }
  try {
    shotBlob = await renderCardBlob();
    saveBlob(shotBlob);
  } catch (e) {
    toast('⚠️ จับภาพไม่สำเร็จ ลองอีกครั้ง');
  } finally {
    shotBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}
function closeExportCard() {
  $('export-overlay').style.display = 'none';
  discardShot();
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
function initApp() {
  // default selected foods
  selected = {
    [RICE]:scoopsToQty(4), [MEAT]:3, 'ไข่ต้ม':2, 'ผัก':4, 'ถั่วลิสง':1, [OIL]:1,
  };

  // nutrition listeners — null-guarded in case DOM changes in future
  ['weight','height','age'].forEach(id => {
    $(id)?.addEventListener('input', updateSettings);
    $(id)?.addEventListener('change', () => { normalizeBodyInputs(); updateSettings(); });
  });
  ['gender','activity-level','eating-program'].forEach(id => {
    $(id)?.addEventListener('change', updateSettings);
  });

  // program start date -> auto-calc end date (28-day program)
  const startDateEl = $('start-date');
  if (startDateEl) {
    if (!startDateEl.value) {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      startDateEl.value = `${y}-${m}-${d}`;
    }
    startDateEl.addEventListener('change', () => { syncEndDate(); updateSettings(); });
    syncEndDate();
  }

  bindFoodGridEvents();
  $('auto-btn').addEventListener('click', autoPortion);
  $('view-btn').addEventListener('click', openExportCard);
  $('export-card').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'shot') captureCard();
    else if (b.dataset.act === 'back') closeExportCard();
  });
  renderFoods();
  updateSettings();

  // one-screen fit: content height changes, window resize, rotation, web-font load
  const appEl = $('app-fit');
  if (appEl && 'ResizeObserver' in window) new ResizeObserver(() => requestAnimationFrame(fitAll)).observe(appEl);
  window.addEventListener('resize', fitAll);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitAll);
  window.addEventListener('orientationchange', () => setTimeout(fitAll, 250));
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitAll);
  fitAll();
}

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',initApp);
else initApp();
</script>
